<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Khan — Walkthrough</title>
<link rel="stylesheet" href="./src/viewer.css">
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<!--
  The desktop app's entry page. Same scene, same modules as index.html — it
  only boots differently: VILLA_BOOT tells main.js to drop you inside the
  house instead of framing the three models from above, so the app opens on
  the front terrace rather than on a drawing.
-->
<script>window.VILLA_BOOT = 'walk';</script>
</head>
<body class="walk-boot">
  <div id="app"></div>

  <div id="hud" class="panel">
    <h1>VILLA KHAN</h1>
    <p>walkthrough · <span id="layout-mode">ZEMIN + BIRINCI KAT</span></p>
    <dl>
      <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>move</dd>
      <dt><kbd>mouse</kbd></dt><dd>look</dd>
      <dt><kbd>shift</kbd></dt><dd>run</dd>
      <dt><kbd>space</kbd></dt><dd>jump</dd>
      <dt><kbd>C</kbd></dt><dd>crouch</dd>
      <dt><kbd>Esc</kbd></dt><dd>release the mouse</dd>
      <dt><kbd>F</kbd></dt><dd>orbit the model instead</dd>
      <dt><kbd>O</kbd></dt><dd>hide roofs</dd>
      <dt><kbd>X</kbd></dt><dd>x-ray walls</dd>
    </dl>
  </div>

  <div id="status" class="panel"></div>
  <div id="loading">Building the house…</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
